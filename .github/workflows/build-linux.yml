name: Build Linux Binary

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI & build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            perl \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-render0-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libfreetype6-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests on Linux
        run: cargo test -- --nocapture

      - name: Build release binary (Linux x86_64)
        run: cargo build --release

      - name: Smoke-test CLI commands
        run: |
          ./target/release/horizon-offline-launcher --version
          ./target/release/horizon-offline-launcher --help
          ./target/release/horizon-offline-launcher --status

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-offline-launcher-linux-bin
          path: target/release/horizon-offline-launcher
          retention-days: 14
