[package]
name = "horizon-offline-launcher"
version = "1.0.0"
edition = "2021"
authors = ["Horizon Community"]
description = "Fast, beautiful, offline Rust launcher for Horizon Minecraft Java Edition 26.3"

[dependencies]
slint = "1.18.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
chrono = "0.4"
tar = "0.4.46"
flate2 = "1.1.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
toml = "0.8"

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
